# KlipperScreen Viewer Configuration
#
# Most installations should leave the model-specific settings below empty.
# The app auto-detects the printer model and applies the correct defaults for
# rotation and touch handling. Only set those values manually if you know you
# need to override the automatic mapping for your printer.
#
# Set VNC_HOST to the IP address or hostname of the Raspberry Pi
# running KlipperScreen with a VNC server (e.g. x11vnc, TigerVNC).
#
# VNC_PORT defaults to 5900. Set VNC_PASSWORD if the server requires one.
# VIEWER_ROTATION is optional. Leave empty for auto-detection from printer model,
# or set 0 / 90 / 180 / 270 to override it manually.
# VIEWER_TOUCH_ROTATION is optional. Leave empty for auto-detection from printer
# model. Set it only if touch input does not line up with the displayed UI.
# VIEWER_TOUCH_SWAP_XY is optional. Leave empty for auto-detection from printer
# model. Set to 1 only if touch X/Y need to be swapped before rotation.
# VIEWER_TOUCH_DEVICE is optional. Leave empty for auto-detection or set a
# specific input node like /dev/input/event1 if needed.
# VNC_COLOR_DEPTH controls requested client color depth (16 or 32). On KS1,
# 32 is usually the better default because the printer framebuffer is 32bpp.
# VNC_UPDATE_INTERVAL_MS throttles frame requests. Lower = smoother, higher =
# lower CPU/network load. Typical values: 50-100.
# VNC_DIRECT_RENDER controls if decoded pixels are written directly to fb0.
# 1 = direct render (lower CPU, default), 0 = back buffer + flip (less tearing).
# UI_KILL_DEBUG enables startup diagnostics for UI takeover.
# 1 = write detailed killed UI PIDs/cmdlines to /tmp/rinkhals/app-fb-vnc-viewer-ui-kill.log
# VIEWER_BOOT_DELAY_SEC delays real startup when called from Rinkhals boot start.sh.
# app.sh returns immediately; delay happens in the detached launch wrapper.
# VIEWER_EXIT_HOLD_MS triggers local exit when holding the physical top-left
# corner for this long. Set to 0 to disable.
# VIEWER_EXIT_CORNER_PX sets the trigger size in pixels. 0 = auto.
# VIEWER_EXIT_MOVE_TOL_PX sets allowed finger drift in pixels. 0 = auto.

VNC_HOST=
VNC_PORT=5900
VNC_PASSWORD=
VIEWER_ROTATION=
VIEWER_TOUCH_ROTATION=
VIEWER_TOUCH_SWAP_XY=
VIEWER_TOUCH_DEVICE=
VNC_COLOR_DEPTH=32
VNC_UPDATE_INTERVAL_MS=125
VNC_DIRECT_RENDER=1
UI_KILL_DEBUG=0
VIEWER_BOOT_DELAY_SEC=15
VIEWER_EXIT_HOLD_MS=5000
VIEWER_EXIT_CORNER_PX=0
VIEWER_EXIT_MOVE_TOL_PX=0
